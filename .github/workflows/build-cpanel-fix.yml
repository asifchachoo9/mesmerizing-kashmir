name: Build changed-source fix ZIP

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'fix/**'
      - '.github/workflows/build-cpanel-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Fix 1 ZIP from changed source files only
        run: |
          rm -rf /tmp/fix-package
          mkdir -p /tmp/fix-package
          # Fix 1 changed only this source file. Keep the ZIP as a patch, not a full site.
          mkdir -p /tmp/fix-package/public
          cp public/index.html /tmp/fix-package/public/index.html
          cd /tmp/fix-package
          zip -qr "$GITHUB_WORKSPACE/fix/fix 1.zip" public/index.html

      - name: Commit changed-source ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "fix/fix 1.zip"
          if git diff --cached --quiet; then
            echo "No ZIP changes to commit."
          else
            git commit -m "Update Fix 1 changed-source ZIP [skip ci]"
            git push
          fi
