name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages site
        shell: bash
        run: |
          rm -rf _site
          cp -a public/. _site/
          # GitHub Pages project sites live below /mesmerizing-kashmir.
          # Convert root-relative local URLs in the published copy only.
          find _site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e 's#([\"'\x27])/#$1/mesmerizing-kashmir/#g; s#url\(([\"'\x27])/#url($1/mesmerizing-kashmir/#g' "$f"
          done
          # GitHub Pages must not process Apache configuration files.
          find _site -name '.htaccess' -delete
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
